<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ball" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#d7ffe6"/>
      <stop offset="0.35" stop-color="#3dffa0"/>
      <stop offset="1" stop-color="#0a7a3a"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Full-bleed background: the art stays inside the central "safe zone" so maskable crops look right. -->
  <rect width="512" height="512" fill="#050806"/>
  <g fill="#00ff66" opacity="0.14" font-family="monospace" font-size="30">
    <text x="128" y="128">1</text><text x="128" y="160">0</text>
    <text x="368" y="140">0</text><text x="368" y="172">1</text>
  </g>
  <circle cx="256" cy="220" r="78" fill="url(#ball)" filter="url(#glow)"/>
  <g stroke="#00ff66" stroke-width="34" stroke-linecap="round" filter="url(#glow)">
    <line x1="150" y1="340" x2="228" y2="378"/>
    <line x1="362" y1="340" x2="284" y2="378"/>
  </g>
</svg>
